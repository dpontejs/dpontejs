name: Generate snake animation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E0A800&color_dots=#ebedf0,#b3d1ea,#7fb0d9,#4b8bbe,#306998
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFD43B&color_dots=#161b22,#1e3a5f,#2b5b8a,#3776ab,#4b8bbe

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
